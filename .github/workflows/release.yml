name: Build & Release Ultimatter

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        run: npm test

  build-and-release:
    name: Build & Publish Multi-Platform Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            zip

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build multi-platform executables
        run: npm run build:all

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          # 1. Linux AppImage (Primary Desktop)
          cp bin/Ultimatter-x86_64.AppImage dist/Ultimatter-x86_64.AppImage

          # Rename binaries inside bin/ so they extract cleanly as "ultimatter" / "ultimatter.exe"
          mv bin/ultimatter-linux-x64 bin/ultimatter
          mv bin/ultimatter-windows-x64.exe bin/ultimatter.exe
          mv bin/ultimatter-macos-arm64 bin/ultimatter

          # 2. Linux Raw Binary Archive (Server / Headless)
          tar -czf dist/ultimatter-linux-x64.tar.gz -C bin ultimatter

          # 3. Windows Executable & Zip Archive
          # We also upload the raw .exe with the long name for convenience
          cp bin/ultimatter.exe dist/ultimatter-windows-x64.exe
          (cd bin && zip ../dist/ultimatter-windows-x64.zip ultimatter.exe)

          # 4. macOS Application Bundle & CLI Archive
          # Ultimatter.app is already cleanly named
          (cd bin && zip -r ../dist/Ultimatter-macos-arm64.zip Ultimatter.app)
          tar -czf dist/ultimatter-macos-arm64.tar.gz -C bin ultimatter

          echo "=== Generated Release Artifacts in dist/ ==="
          ls -lh dist/

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-x86_64.AppImage
            dist/ultimatter-windows-x64.exe
            dist/ultimatter-windows-x64.zip
            dist/Ultimatter-macos-arm64.zip
            dist/ultimatter-macos-arm64.tar.gz
            dist/ultimatter-linux-x64.tar.gz
