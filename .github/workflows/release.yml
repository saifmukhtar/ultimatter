name: Build & Release Ultimatter

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        run: npm test

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            zip

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Linux executables
        run: |
          npm run build:appimage
          npm run build:linux

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp bin/Ultimatter-x86_64.AppImage dist/Ultimatter-x86_64.AppImage

          mv bin/ultimatter-linux-x64 bin/ultimatter
          tar -czf dist/ultimatter-linux-x64.tar.gz -C bin ultimatter

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-x86_64.AppImage
            dist/ultimatter-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Node.js backend
        run: |
          npx @yao-pkg/pkg bin/cli.js --output desktop/ultimatter-backend.exe --targets node22-win-x64

      - name: Build Rust GUI & MSI Installer
        working-directory: desktop
        run: |
          cargo build --release
          cargo wix --nocapture --no-build -v

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          copy desktop\target\wix\*.msi dist\Ultimatter-Windows-x64.msi
          copy desktop\target\release\ultimatter.exe dist\ultimatter-windows-x64.exe

      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-Windows-x64.msi
            dist/ultimatter-windows-x64.exe

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build macOS app and CLI
        run: |
          npm run build:mac
          npm run build:macos:app

      - name: Stage macOS release artifacts
        run: |
          mkdir -p dist
          mv bin/ultimatter-macos-arm64 bin/ultimatter
          (cd bin && zip -r ../dist/Ultimatter-macos-arm64.zip Ultimatter.app)
          tar -czf dist/ultimatter-macos-arm64.tar.gz -C bin ultimatter

      - name: Upload macOS Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-macos-arm64.zip
            dist/ultimatter-macos-arm64.tar.gz
