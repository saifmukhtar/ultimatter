name: Build & Release Ultimatter

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        run: npm test

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            zip

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Linux executables
        run: |
          npm run build:appimage
          # Build the standalone backend
          npx @yao-pkg/pkg bin/cli.js --output bin/ultimatter-backend-linux-x64 --targets node22-linux-x64

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp bin/Ultimatter-x86_64.AppImage dist/Ultimatter-x86_64.AppImage

          # Create a portable folder containing BOTH the GUI and Backend
          mkdir -p dist/portable-linux
          # The AppImage script placed the Rust GUI at bin/ultimatter-linux-x64
          cp bin/ultimatter-linux-x64 dist/portable-linux/ultimatter
          cp bin/ultimatter-backend-linux-x64 dist/portable-linux/ultimatter-backend
          chmod +x dist/portable-linux/ultimatter dist/portable-linux/ultimatter-backend
          
          # Tar them up into a portable bundle
          tar -czf dist/Ultimatter-Linux-Portable-x64.tar.gz -C dist/portable-linux ultimatter ultimatter-backend

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-x86_64.AppImage
            dist/Ultimatter-Linux-Portable-x64.tar.gz

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Node.js backend
        run: |
          npx @yao-pkg/pkg bin/cli.js --output desktop/ultimatter-backend.exe --targets node22-win-x64

      - name: Build Rust GUI
        working-directory: desktop
        run: cargo build --release

      - name: Build MSIX Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          New-Item -ItemType Directory -Force -Path "msix_stage\Assets"

          Copy-Item "desktop\target\release\ultimatter.exe" -Destination "msix_stage\"
          Copy-Item "desktop\ultimatter-backend.exe" -Destination "msix_stage\"
          Copy-Item "packaging\windows\Assets\*" -Destination "msix_stage\Assets\"

          # Sync package version from package.json into AppxManifest.xml
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $msixVersion = "$pkgVersion.0"
          Write-Host "Packaging MSIX version $msixVersion"
          (Get-Content "packaging\windows\AppxManifest.xml") -replace 'Version="[^"]+"', "Version=""$msixVersion""" | Set-Content "msix_stage\AppxManifest.xml"

          # Locate MakeAppx.exe in Windows SDK
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = (Get-ChildItem -Path $sdkPath -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\makeappx.exe$" } | Select-Object -First 1).FullName
          Write-Host "Found MakeAppx at: $makeappx"
          & $makeappx pack /d msix_stage /p dist\Ultimatter-Windows-x64.msix /o /v

      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-Windows-x64.msix

  build-macos:
    name: Build macOS (${{ matrix.arch_name }})
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            node_target: node22-macos-arm64
            arch_name: arm64
          - target: x86_64-apple-darwin
            node_target: node22-macos-x64
            arch_name: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build macOS app and CLI
        env:
          RUST_TARGET: ${{ matrix.target }}
          NODE_TARGET: ${{ matrix.node_target }}
        run: |
          npx @yao-pkg/pkg bin/cli.js --output bin/ultimatter-macos-${{ matrix.arch_name }} --targets ${{ matrix.node_target }}
          bash packaging/macos/build-app.sh

      - name: Stage macOS release artifacts
        run: |
          mkdir -p dist
          mv bin/ultimatter-macos-${{ matrix.arch_name }} bin/ultimatter
          (cd bin && zip -r ../dist/Ultimatter-macos-${{ matrix.arch_name }}.zip Ultimatter.app)
          tar -czf dist/ultimatter-macos-${{ matrix.arch_name }}.tar.gz -C bin ultimatter

      - name: Upload macOS Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Ultimatter ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Ultimatter-macos-${{ matrix.arch_name }}.zip
            dist/ultimatter-macos-${{ matrix.arch_name }}.tar.gz
